# Railway 배포 설정 (GitHub 연동 시 이 파일을 그대로 읽는다)
#
# 서비스 변수
#   NAVER_MAP_CLIENT_ID  — NCP Maps 의 Client ID(Key ID). 브라우저에 그대로 내려간다.
#   DB_PATH              — 기본 /data/app.db (Dockerfile 기본값). 볼륨 마운트 경로와 맞춘다.
#   PORT                 — Railway 가 자동 주입
#
# ⚠️ 볼륨은 대시보드에서 한 번 붙여야 한다 (config 로는 만들 수 없다):
#   서비스 > Data(Volumes) > Add Volume > Mount path: /data
#   붙이지 않으면 커뮤니티 글·방문수가 재배포/재시작마다 사라진다.
#   볼륨을 쓰는 서비스는 복제본을 늘릴 수 없어 numReplicas 는 1로 둔다.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
